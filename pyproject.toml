[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-preproc-ablation"
version = "0.1.0"
description = "Preprocessing as the independent variable in computational-pathology benchmarking: tissue detection and colour calibration, crossed against task-trained and frozen tile encoders, scored on ISUP agreement and on the failures agreement hides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Syed Tahir Hussan", email = "tahirsherazi786@gmail.com" }]
keywords = [
  "computational-pathology",
  "whole-slide-imaging",
  "openslide",
  "qupath",
  "prostate-cancer",
  "gleason",
  "isup",
  "stain-normalisation",
  "colour-calibration",
  "multiple-instance-learning",
  "reproducibility",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<0.27",
  "tifffile>=2024.1",
  "openslide-python>=1.3",
  "openslide-bin>=4.0",
  "torch>=2.2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
wsi-ablation = "wsi_ablation.cli:main"

[project.urls]
Homepage = "https://syedtahirhussan.github.io/wsi-preproc-ablation/"
Repository = "https://github.com/SyedTahirHussan/wsi-preproc-ablation"
Author = "https://syedtahirhussan.github.io/syedtahirhussan"

[tool.setuptools.packages.find]
include = ["wsi_ablation*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["wsi_ablation", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wsi_ablation"]

# mypy parses installed third-party stubs against this version; numpy 2.x stubs
# use PEP 695 syntax that a 3.11 parser rejects. First-party code stays 3.11
# compatible, which is what requires-python promises.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
# scikit-image, scipy and openslide ship no stubs. Strictness stays on the logic
# in this package; calls into untyped scientific libraries do not fail the gate.
disallow_untyped_calls = false
files = ["wsi_ablation"]

[[tool.mypy.overrides]]
module = ["yaml", "scipy.*", "skimage.*", "matplotlib.*", "openslide", "openslide.*", "tifffile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
