name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: OpenSlide is really present
        run: python -c "import openslide; print(openslide.__library_version__)"
      - name: Lint
        run: ruff check wsi_ablation tests
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q
      - name: Reproducibility gate
        run: python -m wsi_ablation.cli --config configs/smoke.yaml repro
